[workspace]
resolver = "3"
members = [
    "crates/alt-ctrl-tui",
    "crates/controller-input",
    "crates/event-store",
    "crates/policy-engine",
    "crates/sidecar-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/dmytro-yemelianov/alt-ctrl"

[workspace.dependencies]
crossterm = "0.28.1"
proptest = "1.7"
ratatui = "0.29.0"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
